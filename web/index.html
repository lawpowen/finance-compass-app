<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Finance Compass - self-hosted, local-first personal finance.">
  <meta name="theme-color" content="#123B3A">
  <meta name="color-scheme" content="dark light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finance Compass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Finance Compass</title>
  <style>
    html, body { margin: 0; background: #123b3a; }
    #finance-boot {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1rem;
      background: #123b3a;
      color: #f2f7f3;
      font: 500 1rem/1.5 system-ui, sans-serif;
    }
    #finance-boot::before {
      content: "";
      width: 1.75rem;
      height: 1.75rem;
      border: 3px solid #618784;
      border-top-color: currentColor;
      border-radius: 50%;
    }
    @media (prefers-reduced-motion: no-preference) {
      #finance-boot::before { animation: boot-spin 1s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(1turn); } }
    }
  </style>
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="finance-boot" role="status" lang="zh">正在打开 Finance Compass…</div>
  <script src="flutter_bootstrap.js" async></script>
  <script src="pwa_bootstrap.js" defer></script>
</body>
</html>
