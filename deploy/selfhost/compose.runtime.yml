services:
  finance-compass:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-compass-web:0.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /data/caddy
      - /config/caddy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
