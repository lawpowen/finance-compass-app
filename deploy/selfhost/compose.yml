services:
  finance-compass:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile
    image: finance-compass-web:0.9.1
    restart: unless-stopped
    # Safe default: reachable only from the host. Put Caddy/Nginx/Tailscale in
    # front of this port before exposing it to any network.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /data/caddy
      - /config/caddy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
