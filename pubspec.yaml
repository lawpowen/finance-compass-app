publish_to: "none"
version: 0.9.1+43

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  drift: ^2.28.1
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.2
  flutter:
    sdk: flutter
  path: ^1.9.1
